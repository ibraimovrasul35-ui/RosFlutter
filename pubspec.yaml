name: recipe_book
description: "Книга рецептов — учебный проект по курсу Pro Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Картинки блюд
  assets:
    - assets/images/

  # Собственный шрифт
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
